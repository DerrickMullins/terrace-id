<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerraceID</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      gap: 2rem;
      padding: 2rem;
    }

    header { text-align: center; }
    header h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px; }
    header h1 span { color: #3fb950; }
    header p  { margin-top: 0.4rem; color: #8b949e; font-size: 0.95rem; }

    /* Record button */
    #btn-record {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid #3fb950;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
      outline: none;
    }
    #btn-record:hover  { background: rgba(63,185,80,0.1); }
    #btn-record:active { transform: scale(0.96); }
    #btn-record.recording {
      border-color: #f85149;
      animation: pulse 1.2s ease-in-out infinite;
    }
    #btn-record .icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3fb950;
      transition: background 0.2s, border-radius 0.2s;
    }
    #btn-record.recording .icon {
      background: #f85149;
      border-radius: 6px;
    }
    #btn-record .label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #3fb950;
    }
    #btn-record.recording .label { color: #f85149; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248,81,73,0.4); }
      50%       { box-shadow: 0 0 0 16px rgba(248,81,73,0); }
    }

    #timer {
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
      color: #8b949e;
      min-height: 1.5rem;
    }

    /* Status / spinner */
    #status {
      font-size: 0.9rem;
      color: #8b949e;
      min-height: 1.2rem;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #3fb950;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Result card ── */
    #result {
      width: 100%;
      max-width: 400px;
      border-radius: 14px;
      padding: 1.6rem;
      display: none;
      text-align: center;
    }
    #result.visible { display: block; }

    /* FOUND */
    #result.found {
      background: #0f2a14;
      border: 2px solid #3fb950;
    }
    #result.found .verdict-icon  { font-size: 2.8rem; }
    #result.found .verdict-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #3fb950;
      margin: 0.5rem 0 0.2rem;
    }
    #result.found .result-team {
      font-size: 1.6rem;
      font-weight: 800;
      color: #3fb950;
      margin-bottom: 0.2rem;
    }
    #result.found .result-chant {
      font-size: 1rem;
      color: #e6edf3;
      margin-bottom: 1.2rem;
    }
    .confidence-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .confidence-bar-bg {
      flex: 1;
      height: 8px;
      background: #21262d;
      border-radius: 4px;
      overflow: hidden;
    }
    .confidence-bar-fill {
      height: 100%;
      background: #3fb950;
      border-radius: 4px;
      transition: width 0.6s ease;
    }
    .confidence-pct {
      font-size: 0.9rem;
      font-weight: 700;
      color: #3fb950;
      min-width: 3.5rem;
      text-align: right;
    }

    /* NOT FOUND */
    #result.not-found {
      background: #2a0f0f;
      border: 2px solid #f85149;
    }
    #result.not-found .verdict-icon  { font-size: 2.8rem; }
    #result.not-found .verdict-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #f85149;
      margin: 0.5rem 0 0.4rem;
    }
    #result.not-found .verdict-msg {
      font-size: 0.9rem;
      color: #8b949e;
    }

    footer {
      font-size: 0.75rem;
      color: #484f58;
    }
  </style>
</head>
<body>

  <header>
    <h1>Terrace<span>ID</span></h1>
    <p>Tap record, sing or play a chant, tap stop.</p>
  </header>

  <button id="btn-record" aria-label="Start recording">
    <div class="icon"></div>
    <span class="label">Record</span>
  </button>

  <div id="timer"></div>
  <div id="status"></div>
  <div id="result"></div>

  <footer>Powered by TerraceID &amp; Supabase</footer>

  <script>
    const btn    = document.getElementById('btn-record');
    const timer  = document.getElementById('timer');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    const API = '/identify';

    let mediaRecorder = null;
    let chunks        = [];
    let timerInterval = null;
    let seconds       = 0;

    function formatTime(s) {
      return `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
    }
    function setStatus(html) { status.innerHTML = html; }
    function clearResult()   { result.className = ''; result.style.display = ''; result.innerHTML = ''; }

    async function startRecording() {
      clearResult();
      setStatus('');
      chunks = [];

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        setStatus('Microphone access denied — please allow mic permissions.');
        return;
      }

      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); sendAudio(); };
      mediaRecorder.start();

      btn.classList.add('recording');
      btn.querySelector('.label').textContent = 'Stop';
      seconds = 0;
      timer.textContent = formatTime(0);
      timerInterval = setInterval(() => { seconds++; timer.textContent = formatTime(seconds); }, 1000);
    }

    function stopRecording() {
      clearInterval(timerInterval);
      timer.textContent = '';
      btn.classList.remove('recording');
      btn.querySelector('.label').textContent = 'Record';
      mediaRecorder.stop();
    }

    async function sendAudio() {
      setStatus('<span class="spinner"></span> Identifying…');

      const mimeType = chunks[0]?.type || 'audio/webm';
      const blob = new Blob(chunks, { type: mimeType });
      const ext  = mimeType.includes('ogg') ? 'ogg' : mimeType.includes('mp4') ? 'mp4' : 'webm';

      const form = new FormData();
      form.append('audio', blob, `recording.${ext}`);

      try {
        const res  = await fetch(API, { method: 'POST', body: form });
        const data = await res.json();
        setStatus('');
        showResult(data);
      } catch (e) {
        setStatus(`Error: ${e.message}`);
      }
    }

    function showResult(data) {
      result.innerHTML = '';

      if (!data.match) {
        result.className = 'visible not-found';
        result.innerHTML = `
          <div class="verdict-icon">❌</div>
          <div class="verdict-label">Not Found</div>
          <div class="verdict-msg">${escHtml(data.message || 'No matching chant found in the database.')}<br>Try a longer or clearer recording.</div>
        `;
        return;
      }

      const { team, chant_name, confidence } = data.match;
      const pct = Math.min(100, Math.max(0, confidence));

      result.className = 'visible found';
      result.innerHTML = `
        <div class="verdict-icon">✅</div>
        <div class="verdict-label">Chant Identified</div>
        <div class="result-team">${escHtml(team)}</div>
        <div class="result-chant">${escHtml(chant_name)}</div>
        <div class="confidence-row">
          <div class="confidence-bar-bg">
            <div class="confidence-bar-fill" style="width:0%"></div>
          </div>
          <div class="confidence-pct">${pct.toFixed(1)}%</div>
        </div>
      `;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        result.querySelector('.confidence-bar-fill').style.width = `${pct}%`;
      }));
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    btn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
      else startRecording();
    });
  </script>
</body>
</html>
